
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="110" viewBox="0 0 700 110">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffee00">
        <animate attributeName="stop-color" values="#ffee00;#39ff14;#ff3030;#ffee00" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#39ff14">
        <animate attributeName="stop-color" values="#39ff14;#ff3030;#ffee00;#39ff14" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff3030">
        <animate attributeName="stop-color" values="#ff3030;#ffee00;#39ff14;#ff3030" dur="4s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="350" y="70"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="46"
        font-weight="900"
        letter-spacing="-2"
        fill="#101010"
        stroke="url(#neon)"
        stroke-width="2.5"
        paint-order="stroke"
        filter="url(#glow)">PENGU1N</text>
</svg>
