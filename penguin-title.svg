
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="110" viewBox="0 0 700 110">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffee00">
        <animate attributeName="stop-color"
          values="#ffee00;#39ff14;#ff3030;#ffee00"
          dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#39ff14">
        <animate attributeName="stop-color"
          values="#39ff14;#ff3030;#ffee00;#39ff14"
          dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff3030">
        <animate attributeName="stop-color"
          values="#ff3030;#ffee00;#39ff14;#ff3030"
          dur="5s" repeatCount="indefinite"/>
      </stop>
      <animate attributeName="x1" values="0%;100%;0%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="350" y="70"
    text-anchor="middle"
    font-family="monospace"
    font-size="43"
    font-weight="900"
    letter-spacing="0"
    fill="#101010"
    stroke="url(#neon)"
    stroke-width="2.5"
    paint-order="stroke"
    filter="url(#glow)">
    PENGU1N
  </text>
</svg>
